name: HueBoard
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
  defaultConfig: Debug
  createIntermediateGroups: true
packages:
  HueBoardKit:
    path: Packages/HueBoardKit
targets:
  HueBoard:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyattowalsh.HueBoard
        PRODUCT_NAME: Hue Board
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: HueBoardKit
        product: HueBoardKit
      - package: HueBoardKit
        product: HueBoardNativeCore
      - package: HueBoardKit
        product: HueBoardAppleEngine
    scheme:
      testTargets:
        - HueBoardAppTests
        - HueBoardUITests
      gatherCoverageData: true
      configVariants:
        - Debug
        - Release

  HueBoardAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyattowalsh.HueBoardTests
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hue Board.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Hue Board"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: HueBoard

  HueBoardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyattowalsh.HueBoardUITests
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HueBoard
    dependencies:
      - target: HueBoard
