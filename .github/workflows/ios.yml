name: Native iOS

on:
  push:
    paths:
      - ios/**
      - frontend/**
      - src/engine.js
      - src/presets.js
      - scripts/export-ios-contract.cjs
      - tests/ios-*.test.cjs
      - tsconfig.json
      - .github/workflows/ios.yml
      - package.json
      - pnpm-lock.yaml
  pull_request:
    paths:
      - ios/**
      - frontend/**
      - src/engine.js
      - src/presets.js
      - scripts/export-ios-contract.cjs
      - tests/ios-*.test.cjs
      - tsconfig.json
      - .github/workflows/ios.yml
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  SANITIZE_NATIVE_EVIDENCE: >-
    ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' ||
        startsWith(github.ref, 'refs/heads/native/0.3.0-') ||
        github.ref == 'refs/heads/native/v6-reconcile-2026-11-20' ||
        startsWith(github.head_ref, 'native/0.3.0-') ||
        github.head_ref == 'native/v6-reconcile-2026-11-20' ||
        startsWith(github.base_ref, 'native/0.3.0-') ||
        github.base_ref == 'native/v6-reconcile-2026-11-20' }}

jobs:
  build-test-archive:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Identify qualification checkout and Xcode toolchain
        if: env.SANITIZE_NATIVE_EVIDENCE == 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version"
          grep -Fx 'Xcode 27.2' "$RUNNER_TEMP/xcode-version"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 27.2
          echo "Source $GITHUB_SHA, Xcode 27.2, iOS simulator SDK 27.2." >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:release
      - run: pnpm build
      - run: pnpm export:ios-contract
      - run: pnpm typecheck
      - name: Verify generated native contract
        run: >-
          git diff --exit-code --
          ios/Packages/HueBoardKit/Sources/HueBoardKit/Resources
          ios/Packages/HueBoardKit/Sources/HueBoardAppleEngine/Resources
      - run: node --test tests/ios-*.test.cjs
      - name: Test shared Swift packages
        id: packages
        run: |
          if [[ "$SANITIZE_NATIVE_EVIDENCE" == true ]]; then
            exec > "$RUNNER_TEMP/native-package-tests.log" 2>&1
          fi
          swift test --package-path ios/Packages/HueBoardKit \
            -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete
      - name: Record qualification package test counts
        if: always() && env.SANITIZE_NATIVE_EVIDENCE == 'true' && (steps.packages.outcome == 'success' || steps.packages.outcome == 'failure')
        run: python3 ios/scripts/ci-candidate-receipt.py package-counts "$RUNNER_TEMP/native-package-tests.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Build pinned XcodeGen
        run: |
          git clone --no-checkout https://github.com/yonaskolb/XcodeGen.git /tmp/XcodeGen
          git -C /tmp/XcodeGen checkout --detach 8445e778451c7e44237b90281bde622d764b0084
          swift build --package-path /tmp/XcodeGen -c release --product xcodegen
      - name: Generate Xcode project
        run: /tmp/XcodeGen/.build/release/xcodegen generate --spec ios/project.yml --project ios
      - name: Select available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          choices=[]
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      choices.append((runtime, device['name'], device['udid']))
          if not choices:
              raise SystemExit('No available iPhone simulator')
          runtime,name,udid=sorted(choices)[-1]
          print(f'udid={udid}')
          print(f'name={name}')
          print(f'runtime={runtime}')
          PY
      - name: Test app and UI targets
        id: simulator-tests
        run: |
          if [[ "$SANITIZE_NATIVE_EVIDENCE" == true ]]; then
            exec > "$RUNNER_TEMP/native-simulator-tests.log" 2>&1
          fi
          xcodebuild -project ios/HueBoard.xcodeproj -scheme HueBoard -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath ios/DerivedData/ci -resultBundlePath ios/DerivedData/HueBoardTests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Record qualification simulator test counts
        if: always() && env.SANITIZE_NATIVE_EVIDENCE == 'true' && (steps.simulator-tests.outcome == 'success' || steps.simulator-tests.outcome == 'failure')
        run: |
          xcrun xcresulttool get test-results summary --path ios/DerivedData/HueBoardTests.xcresult > "$RUNNER_TEMP/simulator-summary.json"
          python3 ios/scripts/ci-candidate-receipt.py simulator-counts "$RUNNER_TEMP/simulator-summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive release configuration without signing
        run: |
          if [[ "$SANITIZE_NATIVE_EVIDENCE" == true ]]; then
            exec > "$RUNNER_TEMP/native-archive.log" 2>&1
          fi
          xcodebuild -project ios/HueBoard.xcodeproj -scheme HueBoard -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ios/DerivedData/HueBoard.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Verify privacy manifest is packaged in archive
        run: test -f 'ios/DerivedData/HueBoard.xcarchive/Products/Applications/Hue Board.app/PrivacyInfo.xcprivacy'
      - name: Verify qualification archive identity and privacy declarations
        if: env.SANITIZE_NATIVE_EVIDENCE == 'true'
        run: python3 ios/scripts/ci-candidate-receipt.py archive ios/DerivedData/HueBoard.xcarchive >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && env.SANITIZE_NATIVE_EVIDENCE == 'false'
        with:
          name: native-ios-evidence-${{ github.sha }}
          path: |
            ios/DerivedData/HueBoardTests.xcresult
            ios/DerivedData/HueBoard.xcarchive
          if-no-files-found: warn
          retention-days: 14
