name: Verify Scriptable release rebuild
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hue-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build candidate from source
        run: pnpm build
      - name: Require exact match with the published source-version manifest
        run: pnpm verify:rebuild
