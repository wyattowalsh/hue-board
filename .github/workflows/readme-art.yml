name: Render README art
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Takumi renderer
        working-directory: scripts/readme-art
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Render alternative artwork without committing it
        working-directory: scripts/readme-art
        run: npm run build
      - name: Check SVG exists
        run: test -s assets/readme/hero-takumi.svg
