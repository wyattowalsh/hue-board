name: Render README art
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned Takumi renderer
        working-directory: scripts/readme-art
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Render alternative artwork without committing it
        working-directory: scripts/readme-art
        run: npm run build
      - name: Check SVG exists
        run: test -s assets/readme/hero-takumi.svg
